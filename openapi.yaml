        '400':
          $ref: '#/components/responses/UngueltigeEingaben'
        '409':
          $ref: '#/components/responses/Konflikt'
        '500':
          $ref: '#/components/responses/Serverfehler'

  /fahrzeugarten/{FAID}:
    parameters:
      - name: FAID
        in: path
        required: true
        description: Primärschlüssel der Fahrzeugart
        schema:
          type: integer
          minimum: 0
        example: 1
    get:
      tags: [Fahrzeugarten]
      summary: Eine Fahrzeugart holen
      operationId: fahrzeugartHolen
      responses:
        '200':
          description: Die Fahrzeugart
          content:
