openapi: 3.0.3

info:
  title: MyEndPoint – Fahrzeugverwaltung
  version: 2.0.0
  description: |
    Universelle REST-API für die Datenbank **fahrzeugverwaltung**.
    Jede freigegebene Tabelle ist eine **Ressource** mit denselben Operationen:
    auflisten, holen, anlegen, ändern und löschen.

    > **Ausprobieren:** Bei jeder Operation Werte eintragen und **Execute** drücken.
    > Die Anfragen gehen wirklich an die API – POST, PUT, PATCH und DELETE ändern die Datenbank.

    Eine Anmeldung gibt es in Version 1 nicht. Zugriffskontrolle kommt optional mit dem SecurityCore
    (siehe README). Bis dahin die API nur im lokalen Netz betreiben.

    ## Aufbau der URLs

    | Methode | URL | Wirkung |
    |---|---|---|
    | GET | `api.php` | Übersicht aller Ressourcen mit ihren Feldern |
    | GET | `api.php/{ressource}` | Liste mit Filter, Sortierung und Seiten |
    | GET | `api.php/{ressource}/{id}` | ein Datensatz |
    | POST | `api.php/{ressource}` | anlegen → `201` und `Location`-Header |
    | PUT / PATCH | `api.php/{ressource}/{id}` | ändern – nur die mitgeschickten Felder |
    | DELETE | `api.php/{ressource}/{id}` | löschen, die Antwort enthält den gelöschten Datensatz |

    Ressourcen: `fahrzeuge`, `fahrzeugtypen`, `fahrzeugarten`, `treibstoffe`, `fahrzeughalter`.
    Mit der `.htaccess` funktioniert auch `api/fahrzeuge` oder nur `fahrzeuge` (ohne `api.php`).

    ## Daten senden

    * Als **JSON** (`Content-Type: application/json`) oder als **Formular**
      (`application/x-www-form-urlencoded`, bei POST auch `multipart/form-data`).
    * Feldnamen = Spaltennamen. Groß-/Kleinschreibung ist egal (`fid` = `FID`).
    * Unbekannte Felder werden mit `400` abgelehnt. Felder, die mit `_` beginnen, werden ignoriert.
    * Leere Formularfelder werden bei Spalten, die NULL erlauben, zu `null`.
    * **PUT und PATCH verhalten sich gleich:** Geändert werden nur die mitgeschickten Felder.

    ## Datentypen

    Typ und Grenzen jedes Felds liest die API aus der Datenbank. Die Übersicht `GET api.php`
    zeigt sie pro Feld als `datentyp` (`int`, `float`, `decimal`, `string`, `bool`, `datetime`)
    mit `min`/`max`, `laenge`, `stellen`/`nachkomma`, `werte` (ENUM) oder `format`.
    Jede Eingabe wird **vor** der Datenbank geprüft und umgewandelt:

    | Eingabe | wird zu |
    |---|---|
    | `"4,2"` (Dezimalkomma) bei `float`/`decimal` | `4.2` |
    | `true`, `"ja"`, `"1"` bei `bool` | `1` (`false`, `"nein"`, `"0"` → `0`) |
    | `"24.12.2026"` bei einem Datum | `"2026-12-24"` |
    | `"pkw"` bei `enum('PKW','LKW')` | `"PKW"` |

    Passt ein Wert nicht (Text in einer Zahl, Zahl außerhalb des Bereichs, zu langer Text,
    falscher ENUM-Wert, ungültiges Datum, zu viele Nachkommastellen), kommt `400` mit dem Feldnamen.
    `decimal` wird als Text ausgegeben (`"12.50"`), damit nichts gerundet wird.

    ## Listen

    * **Filter:** `?Spalte=Wert`, mehrere werden mit UND verknüpft. `*` ist Platzhalter: `?Fahrzeug_Name=VW*`
    * **Sortieren:** `?sort=Fahrzeug_Name,-Leistung` (`-` = absteigend). Ohne Angabe: Primärschlüssel aufsteigend.
    * **Seiten:** `?limit=20&offset=40`. `limit` 1–1000, Standard 100. `gesamt` zählt alle Treffer ohne `limit`.

    ## Verweise zwischen Tabellen

    Eine Spalte, die so heißt wie der Primärschlüssel einer anderen Tabelle, verweist auf diese:
    `fahrzeuge.FAID` → `fahrzeugarten`, `FTID` → `fahrzeugtypen`, `TID` → `treibstoffe`, `FHID` → `fahrzeughalter`.
    Echte Fremdschlüssel in der Datenbank erkennt die API ebenfalls.

    * Speichern mit einem Verweis auf einen Eintrag, den es nicht gibt → `400`
    * Löschen eines Eintrags, auf den noch verwiesen wird → `409`

    ## HTML-Formulare

    Formulare können nur GET und POST senden. Darum `method="post"` und zusätzlich eines davon:

    * verstecktes Feld `_method` mit `PUT`, `PATCH` oder `DELETE`
    * Feld `operation` mit `GET`, `POST`, `UPDATE` oder `DELETE` (wie im alten Formular)
    * Header `X-HTTP-Method-Override` (für Clients ohne PUT/DELETE)

    Steht keine ID in der URL, liest die API sie aus dem Feld, das wie der Primärschlüssel heißt (z. B. `FID`).

    ## Antworten und Fehler

    Antworten sind immer JSON in UTF-8. Fehler sehen so aus: `{"fehler": "…", "details": ["…"]}`.
    SQL-Meldungen in `details` gibt es nur, wenn in `config/.env` `API_DEBUG=1` gesetzt ist (Standard: aus).

    | Status | Bedeutung |
    |---|---|
    | 200 | OK |
    | 201 | angelegt |
    | 204 | Antwort auf OPTIONS (CORS-Vorabanfrage) |
    | 400 | ungültige Eingabe (auch falscher Datentyp), ungültiger Filter oder ungültiges JSON |
    | 404 | Ressource oder Datensatz nicht gefunden |
    | 405 | Methode an dieser Adresse nicht erlaubt |
    | 409 | Konflikt: doppelter Wert oder Eintrag wird noch verwendet |
    | 500 | Serverfehler, z. B. Datenbank nicht erreichbar oder Konfiguration fehlerhaft |

    CORS: Von einer **anderen** Adresse aus dürfen nur die Webseiten per JavaScript zugreifen,
    die in `config/gateway.php` unter `cors.erlaubteUrspruenge` stehen.

    Datentypen und Pflichtfelder in dieser Doku entsprechen der Tabellenstruktur beim Schreiben der Doku.
    Maßgeblich ist immer die Übersicht `GET api.php`, denn die API liest die Spalten selbst aus der Datenbank.

servers:
  - url: ./api.php
    description: Gleicher Ordner wie diese Doku (Standard)
  - url: ./api
    description: Ohne Dateiendung (braucht die .htaccess)
  - url: http://{host}/{ordner}/api.php
    description: Eigene Adresse
    variables:
      host:
        default: localhost
        description: Rechner und ggf. Port, z. B. localhost:8080
      ordner:
        default: MyEndPoint
        description: Ordner unter htdocs

tags:
  - name: Übersicht
    description: Welche Ressourcen und Felder es gibt
  - name: Fahrzeuge
    description: Tabelle `fahrzeuge`
  - name: Fahrzeugtypen
    description: Tabelle `fahrzeugtypen`, z. B. Auto, Motorrad
  - name: Fahrzeugarten
    description: Tabelle `fahrzeugarten`, z. B. PKW, LKW
  - name: Treibstoffe
    description: Tabelle `treibstoffe`, z. B. Benzin, Diesel
  - name: Fahrzeughalter
    description: Tabelle `fahrzeughalter`

paths:

  # ── Übersicht ────────────────────────────────────────────────────
  /:
    get:
      tags: [Übersicht]
      summary: Alle Ressourcen mit ihren Feldern
      description: |
        Liefert jede Ressource mit ihrer URL und ihren Feldern: Datentyp, Primärschlüssel,
        automatisch vergeben, NULL erlaubt, Pflichtfeld und Verweis auf eine andere Ressource.
        Clients können daraus Formulare bauen – so macht es `client/index.php`.
      operationId: uebersicht
      responses:
        '200':
          description: Übersicht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Uebersicht'
        '500':
          $ref: '#/components/responses/Serverfehler'

  # ── Fahrzeuge ────────────────────────────────────────────────────
  /fahrzeuge:
    get:
      tags: [Fahrzeuge]
      summary: Fahrzeuge auflisten
      operationId: fahrzeugeAuflisten
      parameters:
        - name: Fahrzeug_Name
          in: query
          description: 'Filter auf den Namen, `*` ist Platzhalter (z. B. `VW*`)'
          schema:
            type: string
        - name: Leistung
          in: query
          description: Filter auf die Leistung in PS
          schema:
            type: integer
        - name: FAID
          in: query
          description: Nur Fahrzeuge dieser Fahrzeugart
          schema:
            type: integer
        - name: FTID
          in: query
          description: Nur Fahrzeuge dieses Fahrzeugtyps
          schema:
            type: integer
        - name: TID
          in: query
          description: Nur Fahrzeuge mit diesem Treibstoff
          schema:
            type: integer
        - name: FHID
          in: query
          description: Nur Fahrzeuge dieses Halters
          schema:
            type: integer
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Gefundene Fahrzeuge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FahrzeugListe'
        '400':
          $ref: '#/components/responses/UngueltigeParameter'
        '500':
          $ref: '#/components/responses/Serverfehler'
    post:
      tags: [Fahrzeuge]
      summary: Fahrzeug anlegen
      description: Die FID vergibt die Datenbank. Antwort ist das Fahrzeug, wie es jetzt gespeichert ist.
      operationId: fahrzeugAnlegen
      requestBody:
        $ref: '#/components/requestBodies/FahrzeugNeu'
      responses:
        '201':
          description: Angelegt
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fahrzeug'
        '400':
          $ref: '#/components/responses/UngueltigeEingaben'
        '409':
          $ref: '#/components/responses/Konflikt'
        '500':
          $ref: '#/components/responses/Serverfehler'

  /fahrzeuge/{FID}:
    parameters:
      - name: FID
        in: path
        required: true
        description: Primärschlüssel des Fahrzeugs
        schema:
          type: integer
          minimum: 0
        example: 1
    get:
      tags: [Fahrzeuge]
      summary: Ein Fahrzeug holen
      operationId: fahrzeugHolen
      responses:
        '200':
          description: Das Fahrzeug
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fahrzeug'
        '404':
          $ref: '#/components/responses/NichtGefunden'
        '500':
          $ref: '#/components/responses/Serverfehler'
    put:
      tags: [Fahrzeuge]
      summary: Fahrzeug ändern (PUT)
      description: Ändert nur die mitgeschickten Felder – genau wie PATCH.
      operationId: fahrzeugAendernPut
      requestBody:
        $ref: '#/components/requestBodies/FahrzeugAenderung'
      responses:
        '200':
          $ref: '#/components/responses/FahrzeugGeaendert'
        '400':
          $ref: '#/components/responses/UngueltigeEingaben'
        '404':
          $ref: '#/components/responses/NichtGefunden'
        '409':
          $ref: '#/components/responses/Konflikt'
        '500':
          $ref: '#/components/responses/Serverfehler'
    patch:
      tags: [Fahrzeuge]
      summary: Fahrzeug ändern (PATCH)
      description: Ändert nur die mitgeschickten Felder.
      operationId: fahrzeugAendern
      requestBody:
        $ref: '#/components/requestBodies/FahrzeugAenderung'
      responses:
        '200':
          $ref: '#/components/responses/FahrzeugGeaendert'
        '400':
          $ref: '#/components/responses/UngueltigeEingaben'
        '404':
          $ref: '#/components/responses/NichtGefunden'
        '409':
          $ref: '#/components/responses/Konflikt'
        '500':
          $ref: '#/components/responses/Serverfehler'
    delete:
      tags: [Fahrzeuge]
      summary: Fahrzeug löschen
      operationId: fahrzeugLoeschen
      responses:
        '200':
          description: Gelöscht
          content:
            application/json:
              schema:
                type: object
                properties:
                  meldung:
                    type: string
                    example: Datensatz "1" wurde gelöscht.
                  geloescht:
                    $ref: '#/components/schemas/Fahrzeug'
        '404':
          $ref: '#/components/responses/NichtGefunden'
        '500':
          $ref: '#/components/responses/Serverfehler'

  # ── Fahrzeugtypen ────────────────────────────────────────────────
  /fahrzeugtypen:
    get:
      tags: [Fahrzeugtypen]
      summary: Fahrzeugtypen auflisten
      operationId: fahrzeugtypenAuflisten
      parameters:
        - name: FahrzeugTyp
          in: query
          description: 'Filter auf die Bezeichnung, `*` ist Platzhalter (z. B. `Mo*`)'
          schema:
            type: string
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Gefundene Fahrzeugtypen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FahrzeugtypListe'
        '400':
          $ref: '#/components/responses/UngueltigeParameter'
        '500':
          $ref: '#/components/responses/Serverfehler'
    post:
      tags: [Fahrzeugtypen]
      summary: Fahrzeugtyp anlegen
      operationId: fahrzeugtypAnlegen
      requestBody:
        $ref: '#/components/requestBodies/FahrzeugtypNeu'
      responses:
        '201':
          description: Angelegt
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fahrzeugtyp'
        '400':
          $ref: '#/components/responses/UngueltigeEingaben'
        '409':
          $ref: '#/components/responses/Konflikt'
        '500':
          $ref: '#/components/responses/Serverfehler'

  /fahrzeugtypen/{FTID}:
    parameters:
      - name: FTID
        in: path
        required: true
        description: Primärschlüssel des Fahrzeugtyps
        schema:
          type: integer
          minimum: 0
        example: 1
    get:
      tags: [Fahrzeugtypen]
      summary: Einen Fahrzeugtyp holen
      operationId: fahrzeugtypHolen
      responses:
        '200':
          description: Der Fahrzeugtyp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fahrzeugtyp'
        '404':
          $ref: '#/components/responses/NichtGefunden'
        '500':
          $ref: '#/components/responses/Serverfehler'
    put:
      tags: [Fahrzeugtypen]
      summary: Fahrzeugtyp ändern (PUT)
      description: Ändert nur die mitgeschickten Felder – genau wie PATCH.
      operationId: fahrzeugtypAendernPut
      requestBody:
        $ref: '#/components/requestBodies/FahrzeugtypAenderung'
      responses:
        '200':
          $ref: '#/components/responses/FahrzeugtypGeaendert'
        '400':
          $ref: '#/components/responses/UngueltigeEingaben'
        '404':
          $ref: '#/components/responses/NichtGefunden'
        '409':
          $ref: '#/components/responses/Konflikt'
        '500':
          $ref: '#/components/responses/Serverfehler'
    patch:
      tags: [Fahrzeugtypen]
      summary: Fahrzeugtyp ändern (PATCH)
      description: Ändert nur die mitgeschickten Felder.
      operationId: fahrzeugtypAendern
      requestBody:
        $ref: '#/components/requestBodies/FahrzeugtypAenderung'
      responses:
        '200':
          $ref: '#/components/responses/FahrzeugtypGeaendert'
        '400':
          $ref: '#/components/responses/UngueltigeEingaben'
        '404':
          $ref: '#/components/responses/NichtGefunden'
        '409':
          $ref: '#/components/responses/Konflikt'
        '500':
          $ref: '#/components/responses/Serverfehler'
    delete:
      tags: [Fahrzeugtypen]
      summary: Fahrzeugtyp löschen
      description: Nicht möglich, solange ein Fahrzeug diesen Typ hat (`409`).
      operationId: fahrzeugtypLoeschen
      responses:
        '200':
          description: Gelöscht
          content:
            application/json:
              schema:
                type: object
                properties:
                  meldung:
                    type: string
                    example: Datensatz "1" wurde gelöscht.
                  geloescht:
                    $ref: '#/components/schemas/Fahrzeugtyp'
        '404':
          $ref: '#/components/responses/NichtGefunden'
        '409':
          $ref: '#/components/responses/WirdVerwendet'
        '500':
          $ref: '#/components/responses/Serverfehler'

  # ── Fahrzeugarten ────────────────────────────────────────────────
  /fahrzeugarten:
    get:
      tags: [Fahrzeugarten]
      summary: Fahrzeugarten auflisten
      operationId: fahrzeugartenAuflisten
      parameters:
        - name: Fahrzeugarten
          in: query
          description: 'Filter auf die Bezeichnung, `*` ist Platzhalter (z. B. `P*`)'
          schema:
            type: string
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
