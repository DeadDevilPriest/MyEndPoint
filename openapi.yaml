      tags: [Treibstoffe]
      summary: Treibstoff ändern (PATCH)
      description: Ändert nur die mitgeschickten Felder.
      operationId: treibstoffAendern
      requestBody:
        $ref: '#/components/requestBodies/TreibstoffAenderung'
      responses:
        '200':
          $ref: '#/components/responses/TreibstoffGeaendert'
        '400':
          $ref: '#/components/responses/UngueltigeEingaben'
        '404':
          $ref: '#/components/responses/NichtGefunden'
        '409':
          $ref: '#/components/responses/Konflikt'
        '500':
          $ref: '#/components/responses/Serverfehler'
    delete:
      tags: [Treibstoffe]
      summary: Treibstoff löschen
      description: Nicht möglich, solange ein Fahrzeug diesen Treibstoff hat (`409`).
      operationId: treibstoffLoeschen
      responses:
        '200':
          description: Gelöscht
          content:
            application/json:
              schema:
                type: object
                properties:
                  meldung:
                    type: string
                    example: Datensatz "1" wurde gelöscht.
                  geloescht:
                    $ref: '#/components/schemas/Treibstoff'
        '404':
          $ref: '#/components/responses/NichtGefunden'
        '409':
          $ref: '#/components/responses/WirdVerwendet'
        '500':
          $ref: '#/components/responses/Serverfehler'

  # ── Fahrzeughalter ───────────────────────────────────────────────
  /fahrzeughalter:
    get:
      tags: [Fahrzeughalter]
      summary: Fahrzeughalter auflisten
      operationId: fahrzeughalterAuflisten
      parameters:
        - name: Vorname
          in: query
          description: 'Filter auf den Vornamen, `*` ist Platzhalter'
          schema:
            type: string
        - name: Nachname
          in: query
          description: 'Filter auf den Nachnamen, `*` ist Platzhalter (z. B. `Muster*`)'
          schema:
            type: string
        - name: Tel
          in: query
          description: 'Filter auf die Telefonnummer, `*` ist Platzhalter (z. B. `030*`)'
          schema:
            type: string
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Gefundene Fahrzeughalter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FahrzeughalterListe'
        '400':
          $ref: '#/components/responses/UngueltigeParameter'
        '500':
          $ref: '#/components/responses/Serverfehler'
    post:
      tags: [Fahrzeughalter]
      summary: Fahrzeughalter anlegen
      operationId: fahrzeughalterAnlegen
      requestBody:
        $ref: '#/components/requestBodies/FahrzeughalterNeu'
      responses:
        '201':
          description: Angelegt
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fahrzeughalter'
        '400':
          $ref: '#/components/responses/UngueltigeEingaben'
        '409':
          $ref: '#/components/responses/Konflikt'
        '500':
          $ref: '#/components/responses/Serverfehler'

  /fahrzeughalter/{FHID}:
    parameters:
      - name: FHID
        in: path
        required: true
        description: Primärschlüssel des Fahrzeughalters
        schema:
          type: integer
          minimum: 0
        example: 1
    get:
      tags: [Fahrzeughalter]
      summary: Einen Fahrzeughalter holen
      operationId: fahrzeughalterHolen
      responses:
        '200':
          description: Der Fahrzeughalter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fahrzeughalter'
        '404':
          $ref: '#/components/responses/NichtGefunden'
        '500':
          $ref: '#/components/responses/Serverfehler'
    put:
      tags: [Fahrzeughalter]
      summary: Fahrzeughalter ändern (PUT)
      description: Ändert nur die mitgeschickten Felder – genau wie PATCH.
      operationId: fahrzeughalterAendernPut
      requestBody:
        $ref: '#/components/requestBodies/FahrzeughalterAenderung'
      responses:
        '200':
          $ref: '#/components/responses/FahrzeughalterGeaendert'
        '400':
          $ref: '#/components/responses/UngueltigeEingaben'
        '404':
          $ref: '#/components/responses/NichtGefunden'
        '409':
          $ref: '#/components/responses/Konflikt'
        '500':
          $ref: '#/components/responses/Serverfehler'
    patch:
      tags: [Fahrzeughalter]
      summary: Fahrzeughalter ändern (PATCH)
      description: Ändert nur die mitgeschickten Felder.
      operationId: fahrzeughalterAendern
      requestBody:
        $ref: '#/components/requestBodies/FahrzeughalterAenderung'
      responses:
        '200':
          $ref: '#/components/responses/FahrzeughalterGeaendert'
        '400':
          $ref: '#/components/responses/UngueltigeEingaben'
        '404':
          $ref: '#/components/responses/NichtGefunden'
        '409':
          $ref: '#/components/responses/Konflikt'
        '500':
          $ref: '#/components/responses/Serverfehler'
    delete:
      tags: [Fahrzeughalter]
      summary: Fahrzeughalter löschen
      description: Nicht möglich, solange ihm noch ein Fahrzeug gehört (`409`).
      operationId: fahrzeughalterLoeschen
      responses:
        '200':
          description: Gelöscht
          content:
            application/json:
              schema:
                type: object
                properties:
                  meldung:
                    type: string
                    example: Datensatz "1" wurde gelöscht.
                  geloescht:
                    $ref: '#/components/schemas/Fahrzeughalter'
        '404':
          $ref: '#/components/responses/NichtGefunden'
        '409':
          $ref: '#/components/responses/WirdVerwendet'
        '500':
          $ref: '#/components/responses/Serverfehler'


components:

  # ── Wiederverwendete Parameter für Listen ────────────────────────
  parameters:
    sort:
      name: sort
      in: query
      description: |
        Sortierung: Spaltennamen mit Komma getrennt, `-` davor = absteigend.
        Beispiel: `-Leistung` oder `Nachname,Vorname`. Ohne Angabe: Primärschlüssel aufsteigend.
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Höchstens so viele Datensätze liefern
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    offset:
      name: offset
      in: query
      description: So viele Datensätze überspringen (für Seite 2, 3 …)
      schema:
        type: integer
        minimum: 0
        default: 0

  headers:
    Location:
      description: URL des neuen Datensatzes
      schema:
        type: string
        format: uri
        example: http://localhost/MyEndPoint/api.php/fahrzeuge/1

  # ── Request-Bodies: JSON oder Formular ───────────────────────────
  requestBodies:
    FahrzeugNeu:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Fahrzeug'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/Fahrzeug'
    FahrzeugAenderung:
      required: true
      description: Nur die Felder, die sich ändern sollen
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FahrzeugFelder'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/FahrzeugFelder'
    FahrzeugtypNeu:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Fahrzeugtyp'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/Fahrzeugtyp'
    FahrzeugtypAenderung:
      required: true
      description: Nur die Felder, die sich ändern sollen
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FahrzeugtypFelder'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/FahrzeugtypFelder'
    FahrzeugartNeu:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Fahrzeugart'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/Fahrzeugart'
    FahrzeugartAenderung:
      required: true
      description: Nur die Felder, die sich ändern sollen
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FahrzeugartFelder'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/FahrzeugartFelder'
    TreibstoffNeu:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Treibstoff'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/Treibstoff'
    TreibstoffAenderung:
      required: true
      description: Nur die Felder, die sich ändern sollen
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TreibstoffFelder'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/TreibstoffFelder'
    FahrzeughalterNeu:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Fahrzeughalter'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/Fahrzeughalter'
    FahrzeughalterAenderung:
      required: true
      description: Nur die Felder, die sich ändern sollen
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FahrzeughalterFelder'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/FahrzeughalterFelder'

  # ── Antworten ────────────────────────────────────────────────────
  responses:
    FahrzeugGeaendert:
      description: Geändert. Antwort ist der neue Stand.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Fahrzeug'
    FahrzeugtypGeaendert:
      description: Geändert. Antwort ist der neue Stand.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Fahrzeugtyp'
    FahrzeugartGeaendert:
      description: Geändert. Antwort ist der neue Stand.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Fahrzeugart'
    TreibstoffGeaendert:
      description: Geändert. Antwort ist der neue Stand.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Treibstoff'
    FahrzeughalterGeaendert:
      description: Geändert. Antwort ist der neue Stand.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Fahrzeughalter'

    UngueltigeEingaben:
      description: Ungültige Eingaben (Pflichtfeld fehlt, unbekanntes Feld, Verweis ins Leere, falscher Datentyp …)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Fehler'
          example:
            fehler: Ungültige Eingaben.
            details:
              - Pflichtfeld "Fahrzeug_Name" fehlt.
              - 'Feld "Leistung": ganze Zahl von -2147483648 bis 2147483647 erwartet.'
              - 'Feld "FTID": Eintrag "99" gibt es in "fahrzeugtypen" nicht.'
    UngueltigeParameter:
      description: Ungültiger Filter, Sortierung, limit oder offset
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Fehler'
          example:
            fehler: Ungültige Parameter.
            details:
              - limit muss eine ganze Zahl von 1 bis 1000 sein.
              - Unbekannte Sortierspalte "ps".
              - 'Filter "Leistung": ganze Zahl von -2147483648 bis 2147483647 erwartet.'
    NichtGefunden:
      description: Datensatz nicht gefunden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Fehler'
          example:
            fehler: Datensatz "99" nicht gefunden.
    Konflikt:
      description: Konflikt mit vorhandenen Daten, z. B. doppelter Primärschlüssel oder doppelter Wert in einer UNIQUE-Spalte
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Fehler'
          example:
            fehler: Ein Datensatz mit diesem Wert existiert bereits.
    WirdVerwendet:
      description: Der Eintrag wird noch von einem Fahrzeug verwendet und kann nicht gelöscht werden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Fehler'
          example:
            fehler: 'Der Datensatz wird noch in "fahrzeuge" verwendet (Spalte FTID, Anzahl: 2).'
    Serverfehler:
      description: Fehler auf dem Server, z. B. Datenbank nicht erreichbar. `details` nur bei `API_DEBUG = true`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Fehler'
          example:
            fehler: Interner Serverfehler.
            details:
              - SQLSTATE[HY000] [2002] Connection refused

  # ── Datenmodelle ─────────────────────────────────────────────────
  #  <Name>Felder = alle änderbaren Felder, nichts ist Pflicht (für PUT/PATCH)
  #  <Name>       = Datensatz mit ID und Pflichtfeldern (für POST und alle Antworten)
  schemas:

    # Fahrzeuge
    FahrzeugFelder:
      type: object
      properties:
        Fahrzeug_Name:
          type: string
          description: Name bzw. Modell des Fahrzeugs
          example: VW Käfer
        Leistung:
          type: integer
          description: Leistung in PS
          example: 50
        FAID:
          type: integer
          nullable: true
          description: Fahrzeugart – Verweis auf `fahrzeugarten.FAID`
          example: 1
        FTID:
          type: integer
          nullable: true
          description: Fahrzeugtyp – Verweis auf `fahrzeugtypen.FTID`
          example: 1
        TID:
          type: integer
          nullable: true
          description: Treibstoff – Verweis auf `treibstoffe.TID`
          example: 1
        FHID:
          type: integer
          nullable: true
          description: Halter – Verweis auf `fahrzeughalter.FHID`
          example: 1
    Fahrzeug:
      allOf:
        - type: object
          properties:
            FID:
              type: integer
              readOnly: true
              description: Primärschlüssel, vergibt die Datenbank
              example: 1
        - $ref: '#/components/schemas/FahrzeugFelder'
      required: [Fahrzeug_Name, Leistung]
    FahrzeugListe:
      allOf:
        - $ref: '#/components/schemas/ListenInfo'
        - type: object
          properties:
            daten:
              type: array
              items:
                $ref: '#/components/schemas/Fahrzeug'

    # Fahrzeugtypen
    FahrzeugtypFelder:
      type: object
      properties:
        FahrzeugTyp:
          type: string
          description: Bezeichnung des Typs
          example: Auto
    Fahrzeugtyp:
      allOf:
        - type: object
          properties:
            FTID:
              type: integer
              readOnly: true
              description: Primärschlüssel, vergibt die Datenbank
              example: 1
        - $ref: '#/components/schemas/FahrzeugtypFelder'
      required: [FahrzeugTyp]
    FahrzeugtypListe:
      allOf:
        - $ref: '#/components/schemas/ListenInfo'
        - type: object
          properties:
            daten:
              type: array
              items:
                $ref: '#/components/schemas/Fahrzeugtyp'

    # Fahrzeugarten
    FahrzeugartFelder:
      type: object
      properties:
        Fahrzeugarten:
          type: string
          description: Bezeichnung der Fahrzeugart
          example: PKW
    Fahrzeugart:
      allOf:
        - type: object
          properties:
            FAID:
              type: integer
              readOnly: true
              description: Primärschlüssel, vergibt die Datenbank
              example: 1
        - $ref: '#/components/schemas/FahrzeugartFelder'
      required: [Fahrzeugarten]
    FahrzeugartListe:
      allOf:
        - $ref: '#/components/schemas/ListenInfo'
        - type: object
          properties:
            daten:
              type: array
              items:
                $ref: '#/components/schemas/Fahrzeugart'

    # Treibstoffe
    TreibstoffFelder:
      type: object
      properties:
        Treibstoff:
          type: string
          description: Bezeichnung des Treibstoffs
          example: Benzin
    Treibstoff:
      allOf:
        - type: object
          properties:
            TID:
              type: integer
              readOnly: true
              description: Primärschlüssel, vergibt die Datenbank
              example: 1
        - $ref: '#/components/schemas/TreibstoffFelder'
      required: [Treibstoff]
    TreibstoffListe:
      allOf:
        - $ref: '#/components/schemas/ListenInfo'
        - type: object
          properties:
            daten:
              type: array
              items:
                $ref: '#/components/schemas/Treibstoff'

    # Fahrzeughalter
    FahrzeughalterFelder:
      type: object
      properties:
        Vorname:
          type: string
          example: Max
        Nachname:
          type: string
          example: Mustermann
        Tel:
          type: string
          nullable: true
          description: Telefonnummer
          example: 030 1234567
    Fahrzeughalter:
      allOf:
        - type: object
          properties:
            FHID:
              type: integer
              readOnly: true
              description: Primärschlüssel, vergibt die Datenbank
              example: 1
        - $ref: '#/components/schemas/FahrzeughalterFelder'
      required: [Vorname, Nachname]
    FahrzeughalterListe:
      allOf:
        - $ref: '#/components/schemas/ListenInfo'
        - type: object
          properties:
            daten:
              type: array
              items:
                $ref: '#/components/schemas/Fahrzeughalter'

    # Allgemein
    ListenInfo:
      type: object
      properties:
        gesamt:
          type: integer
          description: Treffer insgesamt (ohne limit)
          example: 1
        limit:
          type: integer
          example: 100
        offset:
          type: integer
          example: 0

    Fehler:
      type: object
      required: [fehler]
      properties:
        fehler:
          type: string
          description: Was schiefgegangen ist
        details:
          type: array
          description: Einzelne Probleme, z. B. jedes fehlende Pflichtfeld
          items:
            type: string

    Uebersicht:
      type: object
      properties:
        ressourcen:
          type: object
          description: Schlüssel = Name der Ressource in der URL
          additionalProperties:
            type: object
            properties:
              url:
                type: string
                format: uri
              felder:
                type: object
                description: Schlüssel = Spaltenname
                additionalProperties:
                  $ref: '#/components/schemas/Feldinfo'
      example:
        ressourcen:
          fahrzeugtypen:
            url: http://localhost/MyEndPoint/api.php/fahrzeugtypen
            felder:
              FTID:
                typ: int(11)
                datentyp: int
                min: -2147483648
                max: 2147483647
                pk: true
                auto: true
                'null': false
                pflicht: false
                verweis: null
              FahrzeugTyp:
                typ: varchar(50)
                datentyp: string
                laenge: 50
                pk: false
                auto: false
                'null': false
                pflicht: true
                verweis: null

    Feldinfo:
      type: object
      description: |
        Beschreibung eines Felds, gelesen aus der Datenbank. Die Grenzen (min, max, laenge …)
        erscheinen nur, wenn sie für den Datentyp gelten.
      properties:
        typ:
          type: string
          description: Spaltentyp, so wie die Datenbank ihn meldet
          example: int(11)
        datentyp:
          type: string
          description: Einheitlicher Datentyp – danach prüft die API jede Eingabe
          enum: [int, float, decimal, string, bool, datetime]
          example: int
        min:
          type: number
          description: Kleinster erlaubter Wert (int, float, decimal)
          example: 0
        max:
          type: number
          description: Größter erlaubter Wert (int)
          example: 4294967295
        laenge:
          type: integer
          description: Höchstlänge in Zeichen (bei TEXT/BLOB in Bytes, dann ist `bytes` gesetzt)
          example: 50
        bytes:
          type: boolean
          description: laenge zählt Bytes statt Zeichen (TEXT, BLOB, BINARY)
        stellen:
          type: integer
          description: Stellen insgesamt bei decimal, z. B. 6 bei DECIMAL(6,2)
          example: 6
        nachkomma:
          type: integer
          description: Nachkommastellen bei decimal, z. B. 2 bei DECIMAL(6,2)
          example: 2
        werte:
          type: array
          description: Erlaubte Werte bei ENUM/SET
          items:
            type: string
          example: [PKW, LKW]
        mehrfach:
          type: boolean
          description: SET – mehrere Werte mit Komma getrennt erlaubt
        format:
          type: string
          description: |
            Format bei Datum/Zeit (`Y-m-d`, `Y-m-d H:i:s`, Uhrzeit `H:i:s`) oder `json` bei JSON-Spalten
          example: Y-m-d
        pk:
          type: boolean
          description: Primärschlüssel
        auto:
          type: boolean
          description: Wert wird automatisch vergeben (AUTO_INCREMENT)
        'null':
          type: boolean
          description: Feld darf leer (NULL) sein
        pflicht:
          type: boolean
          description: Muss beim Anlegen angegeben werden
        verweis:
          type: object
          nullable: true
          description: Verweis auf eine andere Ressource, sonst null
          properties:
            ressource:
              type: string
              enum: [fahrzeuge, fahrzeugtypen, fahrzeugarten, treibstoffe, fahrzeughalter]
              example: fahrzeugtypen
            spalte:
              type: string
              example: FTID
