<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyEndPoint API-Doku</title>

    <!-- Swagger UI vom CDN, feste Version. integrity = Prüfsumme: Der Browser führt
         die Datei nur aus, wenn sie genau dieser Version entspricht. -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.34.1/swagger-ui.css"
          integrity="sha384-4c3vsE5f+trhFyHrFrLM1fFGUn531NIaC7dcqEWIJdoRQJ5CkJbSuSCwXLpaS1KF"
          crossorigin="anonymous">
    <style>
        body { margin: 0; background: #fafafa; }
        .kopf {
            font-family: system-ui, sans-serif; background: #1f2937; color: #f9fafb;
            padding: .7rem 20px; display: flex; flex-wrap: wrap; gap: .4rem 1.5rem; align-items: baseline;
        }
        .kopf strong { font-size: 1.05rem; }
        .kopf a { color: #c7d2fe; text-decoration: none; font-size: .9rem; }
        .kopf a:hover { text-decoration: underline; }
        .meldung {
            font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 1rem 1.25rem;
            border-radius: 6px; background: #fdecea; color: #7f1d1d; line-height: 1.5;
        }
        .meldung code { background: #fff; padding: 0 .25rem; border-radius: 3px; }
    </style>
</head>
<body>

<div class="kopf">
    <strong>MyEndPoint – API-Doku</strong>
    <a href="openapi.yaml">openapi.yaml</a>
    <a href="api.php">api.php (Übersicht als JSON)</a>
    <a href="client/index.php">Client</a>
</div>

<div id="meldung" class="meldung" hidden></div>
<div id="swagger-ui"></div>

<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.34.1/swagger-ui-bundle.js"
        integrity="sha384-XFYN47VzPiDY6qPtxYKg0nqUeW/upo20xf1j2SUE7gT/i35FJB4cuS/71Iegzk8Z"
        crossorigin="anonymous"></script>
<script>
    function meldung(html) {
        const kasten = document.getElementById('meldung');
        kasten.innerHTML = html;
        kasten.hidden = false;
    }

    window.addEventListener('load', () => {
        // Als Datei geöffnet (file://)? Dann darf der Browser openapi.yaml nicht laden
        // und "Try it out" erreicht keine API.
        if (location.protocol === 'file:') {
            meldung('Diese Seite muss über den Webserver geöffnet werden, z. B. ' +
                    '<code>http://localhost/MyEndPoint/docs.html</code> – nicht per Doppelklick.');
            return;
        }
        // Swagger UI kommt aus dem Internet (CDN). Ohne Verbindung fehlt sie.
        if (typeof SwaggerUIBundle === 'undefined') {
            meldung('Swagger UI konnte nicht geladen werden. Diese Seite braucht eine Internetverbindung ' +
                    'zu <code>cdn.jsdelivr.net</code>. Die Beschreibung selbst steht in ' +
                    '<a href="openapi.yaml">openapi.yaml</a>.');
            return;
        }

        window.ui = SwaggerUIBundle({
            url: 'openapi.yaml',            // die API-Beschreibung im selben Ordner
            dom_id: '#swagger-ui',
            presets: [SwaggerUIBundle.presets.apis],
            layout: 'BaseLayout',
            tryItOutEnabled: true,          // "Try it out" ist sofort aktiv
            displayRequestDuration: true,   // Antwortzeit anzeigen
            deepLinking: true,              // Link auf einzelne Operationen, z. B. docs.html#/Fahrzeuge/fahrzeugHolen
            docExpansion: 'list',           // Operationen anzeigen, Details erst beim Aufklappen
            defaultModelsExpandDepth: 0,    // Datenmodelle unten eingeklappt
            filter: true,                   // Suchfeld für Tags
            showExtensions: false,
            persistAuthorization: false,
        });
    });
</script>
</body>
</html>
